<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24" data-pptx-page-role="content">
 <rect id="background" data-pptx-role="background" width="1280" height="720" fill="#FFFFFF" />
 <g id="title" data-pptx-bounds="48 28 1184 54" fill="#111111"><text x="48" y="65" font-size="36" font-weight="bold">选定 this.state：按源码语义分组读字节码</text></g>
 <g id="source" data-pptx-bounds="48 96 1184 87" fill="#111111" font-size="20">
  <text x="48" y="115">原函数 TaskControlBlock.prototype.isHeldOrSuspended：</text>
  <text x="48" y="145" font-family="Consolas, Microsoft YaHei, monospace">return (this.state &amp; STATE_HELD) != 0 || (this.state == STATE_SUSPENDED);</text>
  <text x="48" y="177">调用者schedule的this是Scheduler；进入本函数后this是当前TCB。</text>
 </g>
 <g id="qjs-bytecode" data-pptx-bounds="48 211 430 354" fill="#111111">
  <text x="48" y="238" font-size="26" font-weight="bold">QuickJS</text>
  <text x="48" y="276" font-size="20" font-family="Consolas, Microsoft YaHei, monospace" xml:space="preserve"> 0 push_this<tspan x="48" dy="25"> 1 put_loc0 0: this</tspan><tspan x="48" dy="25"> 2 get_loc0 0: this</tspan><tspan x="48" dy="25"> 3 get_field state</tspan><tspan x="48" dy="34"> 8 get_var 0: STATE_HELD</tspan><tspan x="48" dy="25">11 and</tspan><tspan x="48" dy="25">13 neq</tspan><tspan x="48" dy="25">15 if_true8 28</tspan><tspan x="48" dy="34">18 get_loc0 0: this</tspan><tspan x="48" dy="25">19 get_field state</tspan></text>
  <text x="352" y="326" font-size="20" fill="#555555">①取this<tspan x="352" dy="27">读state</tspan></text>
  <text x="352" y="439" font-size="20" fill="#555555">②与/比较<tspan x="352" dy="27">短路</tspan></text>
  <text x="352" y="544" font-size="20" fill="#555555">③再读取</text>
 </g>
 <g id="v8-bytecode" data-pptx-bounds="514 211 718 354" fill="#111111">
  <text x="514" y="238" font-size="26" font-weight="bold">V8 Ignition</text>
  <text x="514" y="276" font-size="20" font-family="Consolas, Microsoft YaHei, monospace" xml:space="preserve"> 0 GetNamedProperty &lt;this&gt;, [0:"state"], FBV[0]<tspan x="514" dy="25"> 4 Star0</tspan><tspan x="514" dy="34"> 5 LdaGlobal [1:"STATE_HELD"], FBV[2]</tspan><tspan x="514" dy="25"> 8 BitwiseAnd r0, EmbeddedFeedback[None]</tspan><tspan x="514" dy="25">13 TestEqual r0, EmbeddedFeedback[None]</tspan><tspan x="514" dy="25">16 LogicalNot</tspan><tspan x="514" dy="25">17 JumpIfTrue [13] (0x1eef0100166e @ 30)</tspan><tspan x="514" dy="34">19 GetNamedProperty &lt;this&gt;, [0:"state"], FBV[4]</tspan></text>
  <text x="514" y="537" font-size="20" fill="#555555">①offset 0–4；②5–17；③19。r0是虚拟frame槽。</text>
 </g>
 <g id="reading-boundary" data-pptx-bounds="48 583 1184 41" fill="#111111" font-size="20"><text x="48" y="611"><tspan font-weight="bold">非连续真实摘录</tspan>，完整序列见附录；左侧为真会短路。offset不是native PC，虚拟槽不是CPU寄存器。</text></g>
