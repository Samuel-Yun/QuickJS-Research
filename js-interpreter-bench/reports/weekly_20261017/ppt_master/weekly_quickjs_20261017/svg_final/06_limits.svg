 <g id="title" data-pptx-bounds="48 28 1184 54" fill="#111111"><text x="48" y="65" font-size="36" font-weight="bold">本周能说什么，还有什么不懂？</text></g>
 <g id="conclusions" data-pptx-bounds="48 108 1184 166" fill="#111111">
  <text x="48" y="135" font-size="26" font-weight="bold">目前能说</text>
  <text x="48" y="180">操作不同，快慢方向可能不同；不把小程序拼成总体引擎排名。</text><text x="48" y="218">多一层原型不足以解释方法案例的跨引擎差距。</text><text x="48" y="256">原 Richards 的普通own字段值得深入；已选出可具体分析的state位置。</text></g>
 <g id="limitations" data-pptx-bounds="48 301 1184 198" fill="#111111">
  <text x="48" y="328" font-size="26" font-weight="bold">两个直接限制：诊断数据，不是正式性能结果</text>
  <text x="48" y="373">无信号N512小对照：冻结版median1718ms，诊断开启版2223ms，高约<tspan font-weight="bold">29%</tspan>。</text>
  <text x="48" y="407" font-size="20" fill="#555555">不同批次的点估计，不是精确插桩成本；时间接近也不能证明没有扰动。</text>
  <text x="48" y="454">两次state读取每Run为10671/10115次，查找区域样本却为<tspan font-weight="bold">85/9</tspan>。</text>
  <text x="48" y="487" font-size="20" fill="#555555">请求1ms、实际约10ms；采样相位和插桩会影响分布，不能视为精确耗时排名。</text>
 </g>
