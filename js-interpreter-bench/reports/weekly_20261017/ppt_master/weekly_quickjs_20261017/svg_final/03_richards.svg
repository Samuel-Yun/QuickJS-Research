 <g id="title" data-pptx-bounds="48 28 1184 54" fill="#111111"><text x="48" y="65" font-size="36" font-weight="bold">原始 Richards：查找区域样本落在哪里？</text></g>
 <g id="intro" data-pptx-bounds="48 98 1184 74" fill="#111111"><text x="48" y="123">Richards 是模拟任务调度的 JavaScript 基准。</text><text x="48" y="159">本轮使用未修改的原算法、方法读取和断言。</text></g>
 <g id="original-code" data-pptx-bounds="48 197 658 323" fill="#111111">
  <text x="48" y="224" font-size="26" font-weight="bold">Scheduler.schedule 摘录</text>
  <text x="48" y="257" font-size="20" fill="#555555">此处 this 是 Scheduler。</text>
  <text x="48" y="294" font-size="20" font-family="Consolas, Microsoft YaHei, monospace">this.currentTcb = this.currentTcb.run();</text>
  <text x="48" y="356" font-size="26" font-weight="bold">TaskControlBlock.run 摘录</text>
  <text x="48" y="389" font-size="20" fill="#555555">进入此函数后，this 是当前 TCB。</text>
  <text x="48" y="426" font-size="20" font-family="Consolas, Microsoft YaHei, monospace">return this.task.run(packet);</text>
  <text font-size="20" x="48" y="476">currentTcb 指向TCB；TCB.task指向具体任务。</text><text font-size="20" x="48" y="504">取得对象、读方法、调用函数不是同一步。</text></g>
