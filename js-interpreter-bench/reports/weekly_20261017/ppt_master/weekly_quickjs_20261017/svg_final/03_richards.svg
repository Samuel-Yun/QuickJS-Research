 <g id="denominator" data-pptx-bounds="748 439 484 100" fill="#111111" font-size="20">
  <text x="748" y="460">3个诊断进程，共5393个内部样本；</text><text x="748" y="489">1229个查找区域样本已映射。</text><text x="748" y="518">按属性聚合，包含多个读/写位置。</text></g>
 <g id="takeaway" data-pptx-bounds="48 554 1184 70" fill="#111111">
  <text x="48" y="578" font-weight="bold">分母是1229，不是全程序耗时。普通状态字段值得继续看，尚未找到总体瓶颈。</text>
  <text x="48" y="614" font-size="20" fill="#555555">方法说明：189个活跃opcode位置；N1/N2倍增核对，计数/采样分开；另39次helper探查无具体site。</text>
 </g>
